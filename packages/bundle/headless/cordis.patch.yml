# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`), the `--session-id` and `--json` options,
# and this app's --help, then the direct driver creates a fresh Agent, or adopts
# the exact Session the flag names, through the core registry and prints its
# durable result.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    # Keep the same temporary process-wide PTC mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json

- id: hmr
  disabled: true

# One-shot jobs use launch-time credentials instead of the interactive store.
- id: credentials
  disabled: true

- id: authorization
  disabled: true

# Browser sign-in writes the interactive credential store that headless does not mount.
- id: deepseek-account
  disabled: true

# Preset provider routes, mirroring the desktop release seed, so the default
# model resolves out of the box. With `credentials` disabled each apiKeyEnv
# resolves through the launch environment; a named-but-unset key fails loud
# (MISSING_CREDENTIAL) only when that route is actually requested. `ollama`
# omits apiKeyEnv and defers to pi-ai's own environment discovery.
- id: llm-pi-ai
  config:
    providers:
      deepseek:
        displayName: DeepSeek
        api: openai-completions
        baseURL: https://api.deepseek.com
        apiKeyEnv: DEEPSEEK_API_KEY
        models:
          - id: deepseek-chat
            input: [text]
          - id: deepseek-reasoner
            input: [text]
            compat: { thinkingFormat: deepseek }
      dashscope:
        displayName: 阿里百炼
        api: openai-completions
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        apiKeyEnv: DASHSCOPE_API_KEY
        compat: { supportsDeveloperRole: false, maxTokensField: max_tokens }
        models:
          - id: qwen-max
            input: [text, image]
      zhipu:
        displayName: 智谱
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/paas/v4
        apiKeyEnv: ZHIPU_API_KEY
        compat: { supportsDeveloperRole: false, maxTokensField: max_tokens }
        models:
          - id: glm-4-plus
            input: [text, image]
      moonshot:
        displayName: Moonshot
        api: openai-completions
        baseURL: https://api.moonshot.cn/v1
        apiKeyEnv: MOONSHOT_API_KEY
        models:
          - id: moonshot-v1-128k
            input: [text]
      siliconflow:
        displayName: SiliconFlow
        api: openai-completions
        baseURL: https://api.siliconflow.cn/v1
        apiKeyEnv: SILICONFLOW_API_KEY
        models:
          - id: deepseek-ai/DeepSeek-V3
            input: [text]
      openrouter:
        displayName: OpenRouter
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        apiKeyEnv: OPENROUTER_API_KEY
        models:
          - id: anthropic/claude-sonnet-4.5
            input: [text, image]
      ollama:
        displayName: Ollama 本地
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        compat: { supportsDeveloperRole: false, maxTokensField: max_tokens }
        models:
          - id: 'qwen2.5:14b'
            input: [text]
